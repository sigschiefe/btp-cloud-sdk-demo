apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: sap-final-probe
  annotations:
    scenarios.ai.sap.com/description: "final probe"
    scenarios.ai.sap.com/name: "sap-final-probe"
    executables.ai.sap.com/description: "final probe serve"
    executables.ai.sap.com/name: "sap-final-probe-serve"
  labels:
    scenarios.ai.sap.com/id: "sap-final-probe"
    executables.ai.sap.com/id: "sap-final-probe-serve"
    ai.sap.com/version: "1.0.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations:
        autoscaling.knative.dev/target: "1"
      labels:
        ai.sap.com/resourcePlan: starter
    spec:
      predictor:
        imagePullSecrets:
          - name: default
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: "ttl.sh/sap-final-combined-svbfiued:24h"
            ports:
              - containerPort: 8080
                protocol: TCP
